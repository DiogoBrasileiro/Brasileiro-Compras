<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Brasileiro Compras</title>
    <meta name="description" content="Sistema de gestão de compras e solicitações para Brasileiro Administração de Condomínios." />
    <meta property="og:title" content="Brasileiro Compras" />
    <meta property="og:description" content="Sistema de gestão de compras e solicitações para Brasileiro Administração de Condomínios." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./logo.png">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f7ff',
                100: '#e0effe',
                200: '#b9ddfe',
                300: '#7cc2fd',
                400: '#36a4fa',
                500: '#0c87eb', // Bright Blue
                600: '#0069c9', // Standard Primary
                700: '#0c1f3b', // Brasileiro Navy (Legacy Brand Color)
                800: '#0a182f',
                900: '#06101f',
              }
            },
            boxShadow: {
              'soft': '0 2px 10px rgba(0, 0, 0, 0.03)',
              'card': '0 4px 20px rgba(0, 0, 0, 0.04)',
              'floating': '0 8px 30px rgba(0, 0, 0, 0.08)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #F8FAFC; /* Slate 50 */
        color: #0f172a; /* Slate 900 - Darker Text */
      }
      
      /* Liquid Glass Utilities - Refined for "Clean" look */
      .glass-panel {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      
      .glass-card {
        background: #FFFFFF; /* Pure White for High Contrast */
        border: 1px solid rgba(229, 231, 235, 1); /* Gray 200 */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      /* Navigation Active States */
      .nav-item-active {
        background: rgba(12, 135, 235, 0.1); /* Brand 500 with opacity */
        color: #0069c9;
      }

      /* Custom Scrollbar - Minimalist */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* iOS Safe Areas */
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      
      /* Prevent zoom on iOS inputs */
      input, select, textarea {
        font-size: 16px !important; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react/": "https://esm.sh/react@^19.2.3/",

    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.5.28",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "recharts": "https://esm.sh/recharts@^3.8.0",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
